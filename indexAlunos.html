<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/app.js" defer></script>
    <link rel="stylesheet" href="./styleAlunos.css">
    <title>Lista de alunos</title>
</head>
<body>
    <header id="headerStatus">
        <div class="infoPrincipaisHeader">
            <img src="./img/logo.svg" alt="logotipo" id="logotipo">
            <img src="./img/sair.png" alt="sair" id="sair">
        </div>

        <div class="statusBar">
            <div class="statusOpcoes">
                <select name="status" id="status">
                    <option>Status</option>
                    <option>Finalizado</option>
                    <option>Cursando</option>
                </select>
            </div>


            <div class="legenda">
                <p>LEGENDA</p>
                <div class="statusCursando">
                    <img src="./img/quadradoAzul.svg" alt="quadradoAzul">
                    <span>Cursando</span>
                </div>
                <div class="statusFinalizado">
                    <img src="./img/quadradoAmarelo.svg" alt="quadradoAmarelo">
                    <span>Finalizado</span>
                </div>
            </div>
        </div>
    </header>

    <main id="containerCards">


    </main>



    <footer>
        <div class="rodape">
            <div class="infoEscola">
                <div class="telefoneContato">
                    <img src="./img/telefone.svg" alt="telefone" id="telefone">
                    <p>(11) 4774-4700</p>
                </div>

                <div class="emailContato">
                    <img src="./img/icon-email.svg" alt="email" id="email">
                    <p>lionschool@gmail.com</p>
                </div>

                <div class="infoLocal">
                    <img src="./img/localizacao.svg" alt="localizacao" id="localizacao">
                    <p>Rua tcc, 211, Centro, Jandira</p>
                </div>
            </div>

            <h2>Copyright © 2026 | Maria Cecilia | DS3M</h2>

            <img src="./img/social-media.png" alt="midias-sociais" id="redes-sociais">
        </div>


    </footer>
    
</body>
</html>
