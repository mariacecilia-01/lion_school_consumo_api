<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/app.js" type: "module" defer"></script>
    <link rel="stylesheet" href="./style.css">
    <title>Lion School</title>
</head>

<body>
    <header>
        <img src="./img/logo.svg" alt="logotipo" id="logotipo">
        <img src="./img/sair.png" alt="sair" id="sair">
    </header>

    <main id="container">
        <div class="divEsquerda">
            <h1>Escolha um <p>curso</p> para administrar</h1>
            <img src="./img/devices.png" alt="dispositivos" id="dispositivos">
            <img src="./img/studant.png" alt="estudante" id="estudante">
        </div>

    </main>

    <footer>
        <div class="rodape">
            <div class="infoEscola">
                <div class="telefoneContato">
                    <img src="./img/telefone.svg" alt="telefone" id="telefone">
                    <p>(11) 4774-4700</p>
                </div>

                <div class="emailContato">
                    <img src="./img/icon-email.svg" alt="email" id="email">
                    <p>lionschool@gmail.com</p>
                </div>

                <div class="infoLocal">
                    <img src="./img/localizacao.svg" alt="localizacao" id="localizacao">
                    <p>Rua tcc, 211, Centro, Jandira</p>
                </div>
            </div>

            <h2>Copyright © 2026 | Maria Cecilia | DS3M</h2>

            <img src="./img/social-media.png" alt="midias-sociais" id="redes-sociais">
        </div>


    </footer>

</body>

</html>
